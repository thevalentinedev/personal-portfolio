        // Simple analytics tracking (optional)
        function trackEvent(action, label) {
            console.log(`Event: ${action} - ${label}`);
            // Add your analytics code here if needed
        }

        // Track button clicks
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const action = this.textContent.trim();
                trackEvent('button_click', action);
            });
        });

        // Track social media clicks
        document.querySelectorAll('.social-link').forEach(link => {
            link.addEventListener('click', function() {
                const platform = this.getAttribute('aria-label');
                trackEvent('social_click', platform);
            });
        });

        // Video interaction tracking
        const video = document.querySelector('video');
        if (video) {
            video.addEventListener('play', () => trackEvent('video', 'play'));
            video.addEventListener('pause', () => trackEvent('video', 'pause'));
            video.addEventListener('ended', () => trackEvent('video', 'completed'));
        }

        // Smooth scroll for any internal links (if added later)
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
